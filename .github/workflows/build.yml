name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      # The post-build step copies the DLL to a local SC4 install, which doesn't exist here
      - name: Build
        run: msbuild src/SC4DllTemplate.sln /p:Configuration=Release /p:Platform=x86 /p:PostBuildEventUseInBuild=false /m

      - uses: actions/upload-artifact@v4
        with:
          name: sc4mp-dll
          path: src/Release/*.dll
