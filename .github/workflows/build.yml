name: Build

# Only after merging into main, so unreviewed code (eg. from a pull request) isn't built into a downloadable DLL.
# Other branches can be built with "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Only the top-level submodules are needed, and EASTL's own submodules are large
      - name: Get submodules
        run: git submodule update --init --depth 1 vendor/gzcom-dll vendor/EASTL vendor/EABase

      - uses: microsoft/setup-msbuild@v2

      # The post-build step copies the DLL to a local SC4 install, which doesn't exist here
      - name: Build
        run: msbuild src/SC4MP.sln /p:Configuration=Release /p:Platform=x86 /p:PostBuildEventUseInBuild=false /m

      - uses: actions/upload-artifact@v4
        with:
          name: sc4mp-dll
          path: src/Release/*.dll
